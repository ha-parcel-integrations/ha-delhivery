# Notify when a Delhivery parcel goes out for delivery.

alias: "Delhivery: out for delivery"
description: Notify when a tracked Delhivery parcel is loaded for delivery today.
mode: queued
max: 10

triggers:
  - trigger: event
    event_type: delhivery_parcel_status_changed

conditions:
  - condition: template
    value_template: "{{ trigger.event.data.new_status == 'out_for_delivery' }}"

actions:
  - action: notify.mobile_app
    data:
      title: "Delhivery onderweg"
      message: >-
        {{ trigger.event.data.sender or trigger.event.data.barcode }}
        wordt vandaag bezorgd.
      data:
        clickAction: "{{ trigger.event.data.url }}"
